name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned portable executable
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: Prepare verification files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path output -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/favspace.exe output/Favspace-Portable-unsigned.exe
          $hash = (Get-FileHash output/Favspace-Portable-unsigned.exe -Algorithm SHA256).Hash
          "$hash  Favspace-Portable-unsigned.exe" | Set-Content output/SHA256SUMS.txt -Encoding ascii

      - name: Upload unsigned build for signing
        uses: actions/upload-artifact@v4
        with:
          name: favspace-windows-x64-unsigned
          path: output/
          if-no-files-found: error
          retention-days: 14
